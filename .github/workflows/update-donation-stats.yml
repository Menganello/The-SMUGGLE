name: Update donation stats

on:
  schedule:
    # Every 3 hours
    - cron: "0 */3 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-stats:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch GoFundMe stats and update JSON
        run: python3 scripts/update_donation_stats.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/data/donation-stats.json
          if git diff --cached --quiet; then
            echo "No change in donation stats."
          else
            git commit -m "Update donation stats [skip ci]"
            git push
          fi
